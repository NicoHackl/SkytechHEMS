name: "Skytech HEMS"
description: >-
  PV-Überschuss-Energiemanagementsystem für Home Assistant. Verteilt den
  Solarüberschuss automatisch und prioritätsbasiert auf regelbare Verbraucher
  (Heizstab, Wallbox) und binäre Verbraucher (Heizlüfter) – mit Zeitschutz,
  Hysterese, Rampenbegrenzung und Notabschaltung. Bedienung über ein
  integriertes Web-UI und HA-Helfer-Entitäten.

  KONFIGURATION: Da das Schema eine Geräteliste enthält, zeigt HA die
  Konfiguration als YAML-Editor an. Alle Felder und deren Bedeutung sind in
  der README des Repositories dokumentiert. Felder je Gerät: name (Pflicht,
  technischer Bezeichner für Entitätsnamen), label (optional, Anzeigename),
  class (Pflicht: controllable, binary oder battery), actual_power_entity (nur
  controllable), switch_entity (nur binary), entity_prefix (optional,
  überschreibt Entitätspräfix), allowed_modes (optional, Standard: auto),
  output_unit (controllable: watt oder ampere, Standard: watt),
  phases (controllable + ampere: 1 oder 3, Standard: 1),
  voltage_l1_entity / voltage_l2_entity / voltage_l3_entity (optional,
  HA-Sensoren für die Phasenspannungen L1/L2/L3, Fallback je 230 V).
  Nur battery: soc_entity (Pflicht), charge_power_entity und
  discharge_power_entity ODER power_entity mit power_sign,
  available_charge_power_entity / available_discharge_power_entity (optional,
  momentanes Geräte-Limit), capacity_kwh (optional, nur für die Anzeige).
  Die globale Option residual_power_entity legt den Überschuss-Sensor fest,
  speicher_in_residual_enthalten sagt, ob die Speicherleistung darin steckt.
version: "1.2.0"
slug: "skytech_hems"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:solar-power
panel_title: "HEMS"
options:
  interval_s: 30
  log_level: "info"
  post_cycle_script: ""
  residual_power_entity: "sensor.verfugbare_leistung_fur_uberschussverbraucher"
  speicher_in_residual_enthalten: true
  devices:
    - name: heizstab
      label: "Heizstab"
      class: controllable
      actual_power_entity: sensor.elwa_modbus_istleistung
      allowed_modes: "auto,nur_heizen"
    - name: wallbox_1
      label: "Wallbox"
      class: controllable
      actual_power_entity: sensor.wallbox_1_istleistung
      entity_prefix: wallbox
      allowed_modes: "auto,nur_laden"
      output_unit: "ampere"
      phases: "1,3"
      phase_switch_delay_s: 300
      voltage_l1_entity: ""
      voltage_l2_entity: ""
      voltage_l3_entity: ""
    - name: heizlufter_1
      label: "Heizlüfter 1"
      class: binary
      switch_entity: switch.heizlufter
      allowed_modes: "auto,nur_heizen"
    - name: heizlufter_2
      label: "Heizlüfter 2"
      class: binary
      switch_entity: switch.heizlufter2
      allowed_modes: "auto,nur_heizen"
schema:
  interval_s: int(1,300)
  log_level: list(debug|info|warning|error)
  post_cycle_script: str?
  residual_power_entity: str?
  speicher_in_residual_enthalten: bool?
  devices:
    - name: str
      label: str?
      class: list(controllable|binary|battery)
      actual_power_entity: str?
      switch_entity: str?
      entity_prefix: str?
      allowed_modes: str?
      output_unit: list(watt|ampere)?
      phases: str?
      phase_switch_delay_s: int?
      voltage_l1_entity: str?
      voltage_l2_entity: str?
      voltage_l3_entity: str?
      soc_entity: str?
      charge_power_entity: str?
      discharge_power_entity: str?
      power_entity: str?
      power_sign: list(positiv_laden|positiv_entladen)?
      available_charge_power_entity: str?
      available_discharge_power_entity: str?
      capacity_kwh: float?
