name: "Skytech HEMS"
description: >-
  PV-Überschuss-Energiemanagementsystem für Home Assistant. Verteilt den
  Solarüberschuss automatisch und prioritätsbasiert auf regelbare Verbraucher
  (Heizstab, Wallbox), binäre Verbraucher (Heizlüfter) und AC-gekoppelte
  Speicher – mit Zeitschutz, Hysterese, Rampenbegrenzung und Notabschaltung.
  Bedienung über ein integriertes Web-UI und HA-Helfer-Entitäten.

  KONFIGURATION: Diese Seite ist der YAML-Editor des Supervisors, weil das
  Schema eine Geräteliste enthält. Bequemer geht es über den Bereich
  „Konfiguration" im Ingress-Panel des Add-ons – er schreibt dieselben Optionen
  über die Supervisor-API. Alle Felder, Pflichtangaben und Fallbacks sind unter
  docs/device_classes/ im Repository dokumentiert.

  Gemeinsame Felder je Gerät: name (Pflicht, technischer Bezeichner für
  Entitätsnamen), class (Pflicht: controllable, binary oder battery), label
  (optional, Anzeigename), entity_prefix (optional, überschreibt das
  Entitätspräfix), allowed_modes (Pflicht, darf leer sein – leer heißt „nur
  Energy Pilot"; zulässig sind manuell, nur_heizen und nur_laden als Teilmenge
  der globalen Option available_modes).

  Nur controllable: actual_power_entity (Pflicht), output_unit (watt oder
  ampere), phases, phase_switch_delay_s, voltage_l1/l2/l3_entity sowie die
  sechs verpflichtenden Add-on-Fallbacks technical_minimum, technical_maximum,
  increase_delay_s, decrease_delay_s, maximum_step_change und
  minimum_step_change in der zu output_unit passenden Einheit.

  Nur binary: switch_entity (Pflicht) sowie die fünf verpflichtenden
  Add-on-Fallbacks power_w, on_reserve_w, min_runtime_s, min_offtime_s und
  off_delay_s.

  Nur battery: soc_entity (Pflicht), genau eine Ist-Leistungsvariante
  (charge_power_entity zusammen mit discharge_power_entity ODER power_entity
  mit power_sign), die beiden verpflichtenden Sensoren
  available_charge_power_entity und available_discharge_power_entity,
  capacity_kwh (nur Anzeige) sowie soc_max_hysteresis_percent und
  direction_switch_delay_s.

  Global: residual_power_entity legt den Überschuss-Sensor fest,
  speicher_in_residual_enthalten sagt, ob die Speicherleistung darin steckt,
  available_modes schaltet die normalen Regelmodi frei.
version: "1.3.0"
slug: "skytech_hems"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
homeassistant_api: true
# Für den Konfigurationsbereich der eigenen Oberfläche: das Add-on liest und
# schreibt seine EIGENEN Optionen über http://supervisor/addons/self/… . Diese
# self-Endpunkte sind laut Supervisor-Sicherheitsvertrag ohne Manager- oder
# Admin-Rolle freigegeben, deshalb bleibt hassio_role auf default.
hassio_api: true
hassio_role: default
ingress: true
ingress_port: 8099
# Die Konfigurationsseite schreibt Add-on-Optionen – das ist eine
# Administratorenaufgabe und wird hier ausdrücklich so markiert.
panel_admin: true
panel_icon: mdi:solar-power
panel_title: "HEMS"
options:
  interval_s: 30
  log_level: "info"
  post_cycle_script: ""
  residual_power_entity: "sensor.verfugbare_leistung_fur_uberschussverbraucher"
  speicher_in_residual_enthalten: true
  available_modes: "manuell,nur_heizen,nur_laden"
  devices:
    - name: heizstab
      label: "Heizstab"
      class: controllable
      actual_power_entity: sensor.elwa_modbus_istleistung
      allowed_modes: "manuell,nur_heizen"
      technical_minimum: 500
      technical_maximum: 3000
      increase_delay_s: 60
      decrease_delay_s: 60
      maximum_step_change: 1000
      minimum_step_change: 50
    - name: wallbox_1
      label: "Wallbox"
      class: controllable
      entity_prefix: wallbox
      actual_power_entity: sensor.wallbox_1_istleistung
      allowed_modes: "manuell,nur_laden"
      output_unit: "ampere"
      phases: "1,3"
      phase_switch_delay_s: 300
      voltage_l1_entity: ""
      voltage_l2_entity: ""
      voltage_l3_entity: ""
      technical_minimum: 6
      technical_maximum: 16
      increase_delay_s: 60
      decrease_delay_s: 60
      maximum_step_change: 2
      minimum_step_change: 1
    - name: heizlufter_1
      label: "Heizlüfter 1"
      class: binary
      switch_entity: switch.heizlufter
      allowed_modes: "manuell,nur_heizen"
      power_w: 1500
      on_reserve_w: 200
      min_runtime_s: 600
      min_offtime_s: 300
      off_delay_s: 120
    - name: heizlufter_2
      label: "Heizlüfter 2"
      class: binary
      switch_entity: switch.heizlufter2
      allowed_modes: "manuell,nur_heizen"
      power_w: 1500
      on_reserve_w: 200
      min_runtime_s: 600
      min_offtime_s: 300
      off_delay_s: 120
    - name: acspeicher1
      label: "AC-Speicher"
      class: battery
      entity_prefix: acspeicher1
      allowed_modes: "manuell,nur_heizen,nur_laden"
      soc_entity: sensor.acspeicher1_soc
      charge_power_entity: sensor.acspeicher1_ladeleistung
      discharge_power_entity: sensor.acspeicher1_entladeleistung
      available_charge_power_entity: sensor.acspeicher1_verfugbare_ladeleistung
      available_discharge_power_entity: sensor.acspeicher1_verfugbare_entladeleistung
      capacity_kwh: 12.8
      soc_max_hysteresis_percent: 2
      direction_switch_delay_s: 5
# Klassenspezifische Felder sind hier bewusst optional: eine gemischte
# Objektliste kann keine bedingten Pflichtfelder ausdrücken, und eine
# Pflichtmarkierung machte jede andere Geräteklasse ungültig. Autoritativ
# validiert app/configuration.py – Oberfläche und Regelung nutzen dieselbe Prüfung.
schema:
  interval_s: int(1,300)
  log_level: list(debug|info|warning|error)
  post_cycle_script: str?
  residual_power_entity: str?
  speicher_in_residual_enthalten: bool?
  available_modes: str?
  devices:
    - name: str
      label: str?
      class: list(controllable|binary|battery)
      entity_prefix: str?
      allowed_modes: str?
      actual_power_entity: str?
      output_unit: list(watt|ampere)?
      phases: str?
      phase_switch_delay_s: float?
      voltage_l1_entity: str?
      voltage_l2_entity: str?
      voltage_l3_entity: str?
      technical_minimum: float?
      technical_maximum: float?
      increase_delay_s: float?
      decrease_delay_s: float?
      maximum_step_change: float?
      minimum_step_change: float?
      switch_entity: str?
      power_w: float?
      on_reserve_w: float?
      min_runtime_s: float?
      min_offtime_s: float?
      off_delay_s: float?
      soc_entity: str?
      charge_power_entity: str?
      discharge_power_entity: str?
      power_entity: str?
      power_sign: list(positiv_laden|positiv_entladen)?
      available_charge_power_entity: str?
      available_discharge_power_entity: str?
      capacity_kwh: float?
      soc_max_hysteresis_percent: float?
      direction_switch_delay_s: float?
