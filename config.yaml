name: "Skytech HEMS"
description: >-
  PV-Überschuss-Energiemanagementsystem für Home Assistant. Verteilt den
  Solarüberschuss automatisch und prioritätsbasiert auf regelbare Verbraucher
  (Heizstab, Wallbox) und binäre Verbraucher (Heizlüfter) – mit Zeitschutz,
  Hysterese, Rampenbegrenzung und Notabschaltung. Bedienung über ein
  integriertes Web-UI und HA-Helfer-Entitäten.
version: "1.0.5"
slug: "skytech_hems"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:solar-power
panel_title: "HEMS"
options:
  interval_s: 30
  log_level: "info"
  post_cycle_script: ""
schema:
  interval_s: int(5,300)
  log_level: list(debug|info|warning|error)
  post_cycle_script: str?
