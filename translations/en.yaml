configuration:
  devices:
    name: Device list
    description: >-
      List of consumers managed by the EMS. Fields per entry:

      • name (required) – Technical identifier, used directly as the prefix for
      all HA helper entities. Example: name=heizstab →
      input_boolean.ems_heizstab_freigabe, input_number.ems_heizstab_prioritat
      etc. Use only lowercase letters, digits and underscores.

      • label (optional) – Display name shown in the web UI and Steuerung tab.
      May contain umlauts, spaces and special characters (e.g. "Fan Living
      Room"). Has no effect on entity names.

      • class (required) – Device class: "controllable" for continuously
      variable consumers (heating rod, wallbox), "binary" for on/off devices
      (fan heater, pump).

      • actual_power_entity (controllable only, required) – Sensor entity that
      provides the current actual power draw in watts, e.g.
      sensor.elwa_modbus_istleistung.

      • switch_entity (binary only, required) – Switch entity of the real
      device, e.g. switch.heizlufter. The EMS reads the actual state and
      switch age from this entity.

      • entity_prefix (optional) – Overrides the HA entity prefix when it
      differs from name. Needed if HA helpers were already created with a
      different prefix. Example: name=wallbox_1 but helpers are named
      ems_wallbox_* → entity_prefix=wallbox.

      • allowed_modes (optional, default "auto") – Comma-separated list of
      global EMS modes in which this device participates. Possible values:
      auto, nur_heizen, nur_laden. Example: "auto,nur_heizen".

      • output_unit (optional, controllable only, default "watt") – Unit of
      the output value. "watt" writes Watts to the setpoint entity. "ampere"
      converts the internally calculated Watts to Ampere (integer, always
      rounded down) — required for wallboxes and similar devices.

      • phases (optional, controllable + ampere only, default "1") – Phase
      count: "1" (single-phase) or "3" (three-phase). Determines the
      conversion I = P ÷ (phases × phase voltage). Example: 6900 W
      ÷ (3 × 230 V) = 10 A.

      • voltage_entity (optional, controllable + ampere only) – HA sensor
      for the current phase voltage in Volts (e.g.
      sensor.wallbox_voltage_l1). Plausibility range 180–260 V; outside
      this range or when unavailable, 230 V is used as fallback. Leave
      empty if no voltage sensor is available.
  interval_s:
    name: Control interval (seconds)
    description: >-
      How often the EMS control cycle runs. Shorter intervals (e.g. 10 s)
      react faster to PV power changes but generate more HA API requests.
      Recommended: 30 s for normal operation. Allowed range: 5 – 300 s.
  log_level:
    name: Log level
    description: >-
      Verbosity of the add-on logs. „info" is sufficient for normal
      operation. „debug" additionally logs all control decisions (pool,
      deficit, device candidates) and is useful for troubleshooting.
      The log level can also be toggled at runtime via the HA helper
      „input_boolean.ems_pyems_debug_output" without restarting the add-on.
  post_cycle_script:
    name: Post-cycle script (optional)
    description: >-
      HA script entity ID (e.g. „script.hems_notification") that is called
      after each completed EMS cycle. Can be used for notifications or
      writing values to an external store. Leave empty if not needed.
