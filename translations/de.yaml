configuration:
  devices:
    name: Geräteliste
    description: >-
      Liste der vom EMS geregelten Verbraucher. Felder je Eintrag:

      • name (Pflicht) – Technischer Bezeichner, wird direkt als Präfix für
      alle HA-Helfer-Entitäten verwendet. Beispiel: name=heizstab →
      input_boolean.ems_heizstab_freigabe, input_number.ems_heizstab_prioritat
      usw. Nur Kleinbuchstaben, Ziffern und Unterstriche verwenden.

      • label (optional) – Anzeigename in der Web-UI und im Steuerung-Tab.
      Kann Umlaute, Leerzeichen und Sonderzeichen enthalten (z. B. „Heizlüfter
      Wohnzimmer"). Hat keinen Einfluss auf die Entitätsnamen.

      • class (Pflicht) – Geräteklasse: „controllable" für stufenlos regelbare
      Verbraucher (Heizstab, Wallbox), „binary" für AN/AUS-Geräte (Heizlüfter,
      Pumpe).

      • actual_power_entity (nur controllable, Pflicht) – Sensor-Entität die
      die aktuelle Ist-Leistung des Geräts in Watt liefert, z. B.
      sensor.elwa_modbus_istleistung.

      • switch_entity (nur binary, Pflicht) – Schalt-Entität des realen Geräts,
      z. B. switch.heizlufter. Das EMS liest daraus den Ist-Zustand und die
      Schaltdauer.

      • entity_prefix (optional) – Überschreibt den HA-Entitätspräfix, wenn
      dieser vom name abweicht. Nötig wenn die HA-Helfer bereits mit einem
      anderen Präfix angelegt wurden. Beispiel: name=wallbox_1 aber Helfer
      heißen ems_wallbox_* → entity_prefix=wallbox.

      • allowed_modes (optional, Standard „auto") – Kommagetrennte Liste der
      globalen Regelmodi, in denen das Gerät aktiv ist. Mögliche Werte: auto,
      nur_heizen, nur_laden. Beispiel: „auto,nur_heizen".

      • output_unit (optional, nur controllable, Standard „watt") – Einheit
      des Ausgabewerts. „watt" schreibt Watt in die Anforderungs-Entität.
      „ampere" konvertiert intern berechnete Watt in Ampere (ganzzahlig,
      immer abgerundet) – benötigt von Wallboxen und ähnlichen Geräten.

      • phases (optional, nur controllable + ampere, Standard „1") –
      Kommagetrennte Phasenkonfiguration. Erlaubte Werte: „1" (einphasig),
      „3" (dreiphasig) oder „1,3" (automatische Phasenumschaltung). Bei „1,3"
      wählt das EMS automatisch 3-phasiges Laden wenn der PV-Pool ausreicht
      (floor(pool ÷ (3 × U)) ≥ min_technisch_a), sonst 1-phasig.
      Umrechnungsformel: I = floor(P ÷ (Phasen × U)).

      • phase_switch_delay_s (optional, nur controllable + ampere + phases=„1,3",
      Standard 300) – Hysterese-Sperrzeit in Sekunden zwischen zwei
      Phasenwechseln. Verhindert schnelles Hin- und Herschalten bei
      Leistungsschwankungen. Empfehlung: 300 s (5 Minuten).

      • voltage_entity (optional, nur controllable + ampere) – HA-Sensor
      für die aktuelle Phasenspannung in Volt (z. B.
      sensor.wallbox_spannung_l1). Plausibilitätsbereich 180–260 V;
      außerhalb oder bei fehlendem Wert wird automatisch 230 V verwendet.
      Leer lassen wenn kein Sensor vorhanden.
  interval_s:
    name: Regelintervall (Sekunden)
    description: >-
      Wie oft der EMS-Regelzyklus ausgeführt wird. Kleinere Werte (z. B. 10 s)
      reagieren schneller auf Leistungsänderungen der PV-Anlage, erzeugen aber
      mehr HA-API-Anfragen. Empfehlung: 30 s für den normalen Betrieb.
      Erlaubter Bereich: 5 – 300 s.
  log_level:
    name: Log-Level
    description: >-
      Detaillierungsgrad der Add-on-Protokolle. „info" ist für den
      Normalbetrieb ausreichend. „debug" gibt zusätzlich alle
      Regelentscheidungen (Pool, Defizit, Geräte-Kandidaten) aus –
      nützlich zur Fehlersuche. Der Log-Level kann auch zur Laufzeit über
      den HA-Helfer „input_boolean.ems_pyems_debug_output" umgeschaltet
      werden, ohne das Add-on neu zu starten.
  post_cycle_script:
    name: Post-Cycle-Skript (optional)
    description: >-
      HA-Skript-Entity-ID (z. B. „script.hems_benachrichtigung"), das nach
      jedem abgeschlossenen EMS-Zyklus aufgerufen wird. Kann z. B. für
      Benachrichtigungen oder das Schreiben von Messwerten in einen externen
      Speicher genutzt werden. Leer lassen, wenn nicht benötigt.
