configuration:
  devices:
    name: Geräteliste
    description: >-
      Liste der vom EMS geregelten Verbraucher. Felder je Eintrag:

      • name (Pflicht) – Technischer Bezeichner, wird direkt als Präfix für
      alle HA-Helfer-Entitäten verwendet. Beispiel: name=heizstab →
      input_boolean.ems_heizstab_freigabe, input_number.ems_heizstab_prioritat
      usw. Nur Kleinbuchstaben, Ziffern und Unterstriche verwenden.

      • label (optional) – Anzeigename in der Web-UI und im Steuerung-Tab.
      Kann Umlaute, Leerzeichen und Sonderzeichen enthalten (z. B. „Heizlüfter
      Wohnzimmer"). Hat keinen Einfluss auf die Entitätsnamen.

      • class (Pflicht) – Geräteklasse: „controllable" für stufenlos regelbare
      Verbraucher (Heizstab, Wallbox), „binary" für AN/AUS-Geräte (Heizlüfter,
      Pumpe), „battery" für einen AC-gekoppelten Speicher.

      • actual_power_entity (nur controllable, Pflicht) – Sensor-Entität die
      die aktuelle Ist-Leistung des Geräts in Watt liefert, z. B.
      sensor.elwa_modbus_istleistung.

      • switch_entity (nur binary, Pflicht) – Schalt-Entität des realen Geräts,
      z. B. switch.heizlufter. Das EMS liest daraus den Ist-Zustand und die
      Schaltdauer.

      • entity_prefix (optional) – Überschreibt den HA-Entitätspräfix, wenn
      dieser vom name abweicht. Nötig wenn die HA-Helfer bereits mit einem
      anderen Präfix angelegt wurden. Beispiel: name=wallbox_1 aber Helfer
      heißen ems_wallbox_* → entity_prefix=wallbox.

      • allowed_modes (optional, Standard „auto") – Kommagetrennte Liste der
      globalen Regelmodi, in denen das Gerät aktiv ist. Mögliche Werte: auto,
      nur_heizen, nur_laden. Beispiel: „auto,nur_heizen".

      • output_unit (optional, nur controllable, Standard „watt") – Einheit
      des Ausgabewerts. „watt" schreibt Watt in die Anforderungs-Entität.
      „ampere" konvertiert intern berechnete Watt in Ampere (ganzzahlig,
      immer abgerundet) – benötigt von Wallboxen und ähnlichen Geräten.

      • phases (optional, nur controllable + ampere, Standard „1") –
      Kommagetrennte Phasenkonfiguration. Erlaubte Werte: „1" (einphasig),
      „3" (dreiphasig) oder „1,3" (automatische Phasenumschaltung). Bei „1,3"
      wählt das EMS automatisch 3-phasiges Laden wenn der PV-Pool ausreicht
      (floor(pool ÷ (3 × U)) ≥ min_technisch_a), sonst 1-phasig.
      Umrechnungsformel: I = floor(P ÷ (Phasen × U)).

      • phase_switch_delay_s (optional, nur controllable + ampere + phases=„1,3",
      Standard 300) – Hysterese-Sperrzeit in Sekunden zwischen zwei
      Phasenwechseln. Verhindert schnelles Hin- und Herschalten bei
      Leistungsschwankungen. Empfehlung: 300 s (5 Minuten).

      • voltage_l1_entity / voltage_l2_entity / voltage_l3_entity (optional,
      nur controllable + ampere) – HA-Sensoren für die aktuellen
      Phasenspannungen L1-N, L2-N und L3-N in Volt (z. B.
      sensor.wallbox_spannung_l1). Plausibilitätsbereich 180–260 V je Phase;
      außerhalb oder bei fehlendem Sensor wird automatisch 230 V verwendet.
      Bei 1-phasigem Betrieb wird nur L1 herangezogen, bei 3-phasigem alle
      drei (P = I × (U_L1 + U_L2 + U_L3)). Leer lassen wenn kein Sensor
      vorhanden.
      • soc_entity (nur battery, Pflicht) – Sensor-Entität mit dem Ladezustand
      in Prozent. Liefert sie „unavailable", fällt dieser Speicher aus der
      Regelung und geht auf Standby; die übrigen Geräte laufen weiter.

      • charge_power_entity / discharge_power_entity (nur battery) – Ist-Lade-
      und Ist-Entladeleistung in Watt, beide als positive Werte. Alternativ
      power_entity mit power_sign, wenn das Gerät nur eine signierte Entität
      liefert.

      • power_sign (nur battery, Standard „positiv_laden") – Vorzeichen von
      power_entity: „positiv_laden" oder „positiv_entladen".

      • available_charge_power_entity / available_discharge_power_entity (nur
      battery, optional) – momentanes Lade- bzw. Entladelimit des Geräts
      (Temperatur- oder Zell-Derating). Hat Vorrang vor den konfigurierten
      Maximalwerten.

      • capacity_kwh (nur battery, optional) – nutzbare Kapazität in kWh. Wird
      nur für die Anzeige verwendet (Energieinhalt, kapazitätsgewichteter
      SoC-Durchschnitt).

      Ein Speicher schreibt EINEN signierten Sollwert nach
      input_number.ems_<präfix>_anforderung_leistung_w (positiv = laden,
      negativ = entladen) und die Betriebsart nach
      input_select.ems_<präfix>_anforderung_betriebsart. Der Zahlen-Helfer
      braucht deshalb ein negatives Minimum, sonst klemmt Home Assistant jede
      Entladeanforderung auf 0. Die Übersetzung in Modbus- oder MQTT-Aufrufe
      übernimmt eine HA-Automation, nicht das Add-on.
  interval_s:
    name: Regelintervall (Sekunden)
    description: >-
      Wie oft der EMS-Regelzyklus ausgeführt wird. Kleinere Werte (z. B. 10 s)
      reagieren schneller auf Leistungsänderungen der PV-Anlage, erzeugen aber
      mehr HA-API-Anfragen. Empfehlung: 30 s für den normalen Betrieb.
      Erlaubter Bereich: 1 – 300 s.
  log_level:
    name: Log-Level
    description: >-
      Detaillierungsgrad der Add-on-Protokolle. „info" ist für den
      Normalbetrieb ausreichend. „debug" gibt zusätzlich alle
      Regelentscheidungen (Pool, Defizit, Geräte-Kandidaten) aus –
      nützlich zur Fehlersuche. Unabhängig davon lässt sich das
      zusätzliche Regelentscheidungs-Logging zur Laufzeit über den
      HA-Helfer „input_boolean.ems_pyems_debug_output" ein- und
      ausschalten, ohne das Add-on neu zu starten; der hier eingestellte
      Log-Level bleibt davon unberührt.
  post_cycle_script:
    name: Post-Cycle-Skript (optional)
    description: >-
      HA-Skript-Entity-ID (z. B. „script.hems_benachrichtigung"), das nach
      jedem abgeschlossenen EMS-Zyklus aufgerufen wird. Kann z. B. für
      Benachrichtigungen oder das Schreiben von Messwerten in einen externen
      Speicher genutzt werden. Leer lassen, wenn nicht benötigt.
  residual_power_entity:
    name: Überschuss-Sensor (verfügbare Leistung)
    description: >-
      HA-Sensor-Entität, die den aktuell für Überschussverbraucher verfügbaren
      PV-Überschuss in Watt liefert. Dies ist der wichtigste Eingangswert des
      EMS. Erwartete Semantik: positiver Wert = Einspeise-Überschuss, negativer
      Wert = Netzbezug; die bereits vom EMS geschalteten Lasten müssen im Wert
      noch enthalten (also abgezogen) sein, da das EMS sie zur Pool-Berechnung
      zurückrechnet. Standard:
      sensor.verfugbare_leistung_fur_uberschussverbraucher (Home Assistant
      slugifiziert Umlaute: ü→u, ö→o, ä→a, ß→ss).
  speicher_in_residual_enthalten:
    name: Speicherleistung im Überschuss-Sensor enthalten
    description: >-
      Ob die Lade- und Entladeleistung der vom HEMS geregelten Speicher im
      Überschuss-Sensor bereits enthalten ist. Bei AC-gekoppelten Speichern mit
      Messpunkt an der Netzübergabe ist das der Normalfall („an"): das EMS
      rechnet die gemessene Entladung heraus, bevor es den Pool bildet.
      Andernfalls liest es die eigene Entladung als PV-Überschuss, schaltet
      Verbraucher zu und der Speicher ist in einem Zyklus leer. Auf „aus"
      stellen, wenn der Sensor den Speicher bereits herausrechnet. Prüfen:
      EMS deaktivieren, Speicher von Hand auf 1 kW Entladung zwingen – steigt
      der Sensorwert um 1 kW, gehört diese Option auf „an". Speicher, die das
      HEMS nicht regelt (z. B. ein selbstregelnder Hybridspeicher), sind davon
      nicht betroffen.
