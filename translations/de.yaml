configuration:
  devices:
    name: Geräteliste
    description: >-
      Liste der vom HEMS geregelten Geräte. Felder je Eintrag:

      • name (Pflicht) – Technischer Bezeichner, wird ohne entity_prefix direkt
      als Präfix für alle HA-Helfer-Entitäten verwendet. Beispiel:
      name=heizstab → input_boolean.ems_heizstab_freigabe,
      input_number.ems_heizstab_prioritat usw. Nur Kleinbuchstaben, Ziffern und
      Unterstriche, und je Anlage eindeutig.

      • label (optional) – Anzeigename in der Web-UI und im Steuerung-Tab. Kann
      Umlaute, Leerzeichen und Sonderzeichen enthalten (z. B. „Heizlüfter
      Wohnzimmer"). Hat keinen Einfluss auf die Entitätsnamen.

      • class (Pflicht) – Geräteklasse: „controllable" für stufenlos regelbare
      Verbraucher (Heizstab, Wallbox), „binary" für AN/AUS-Geräte (Heizlüfter,
      Pumpe), „battery" für einen AC-gekoppelten Speicher.

      • entity_prefix (optional) – Überschreibt den HA-Entitätspräfix, wenn
      dieser vom name abweicht. Nötig, wenn die HA-Helfer bereits mit einem
      anderen Präfix angelegt wurden. Beispiel: name=wallbox_1, aber die Helfer
      heißen ems_wallbox_* → entity_prefix=wallbox. Muss ebenfalls eindeutig
      sein.

      • allowed_modes (Pflicht, darf leer sein) – Kommagetrennte Liste der
      globalen Regelmodi, in denen normale Nutzerregeln auf dieses Gerät
      wirken. Zulässig sind manuell, nur_heizen und nur_laden, jeweils als
      Teilmenge der globalen Option available_modes. Der Alt-Wert „auto" wird
      automatisch auf „manuell" abgebildet. Ein leerer Wert ist gültig und
      bedeutet „nur Energy Pilot": normale Nutzerregeln aktivieren das Gerät
      dann nicht.

      REGELBARE GERÄTE (class: controllable)

      • actual_power_entity (Pflicht) – Sensor-Entität mit der aktuellen
      Ist-Leistung des Geräts in Watt, z. B. sensor.elwa_modbus_istleistung.
      Fehlt sie, wird der Eintrag beim Start übersprungen und in der
      Oberfläche als inaktives Gerät angezeigt.

      • output_unit (optional, Standard „watt") – Einheit des Ausgabewerts.
      „watt" schreibt Watt in die Anforderungs-Entität. „ampere" rechnet die
      intern berechneten Watt in ganze Ampere um (immer abgerundet) und nutzt
      die _a-Helfer – benötigt von Wallboxen und ähnlichen Geräten.

      • phases (optional, nur bei output_unit=ampere, Standard „1") –
      Kommagetrennte Phasenkonfiguration. Erlaubt sind „1" (einphasig), „3"
      (dreiphasig) oder „1,3" (automatische Phasenumschaltung). Bei „1,3"
      wählt das HEMS dreiphasiges Laden, sobald der PV-Pool ausreicht
      (floor(Pool ÷ (Phasen × U)) ≥ technical_minimum), sonst einphasig.

      • phase_switch_delay_s (optional, nur bei phases „1,3", Standard 300) –
      Sperrzeit in Sekunden zwischen zwei Phasenwechseln. Fallback für den
      optionalen Helfer input_number.ems_<präfix>_min_umschaltzeit_s.

      • voltage_l1_entity / voltage_l2_entity / voltage_l3_entity (optional,
      nur bei output_unit=ampere) – HA-Sensoren für die Phasenspannungen L1-N,
      L2-N und L3-N in Volt. Plausibilitätsbereich 180–260 V je Phase;
      außerhalb oder bei fehlendem Sensor werden 230 V verwendet.

      • technical_minimum / technical_maximum (Pflicht) – Untere und obere
      technische Grenze in der zu output_unit passenden Einheit (W oder A).
      technical_minimum ab 0, technical_maximum größer als 0 und mindestens so
      groß wie das Minimum. Beide sind Fallback für die gleichnamigen Helfer
      min_technisch_<w|a> und max_technisch_<w|a>: ein gültiger HA-Wert hat
      Vorrang, ein fehlender oder ausgefallener wird durch diesen Wert ersetzt.

      • increase_delay_s / decrease_delay_s (Pflicht) – Mindestabstand in
      Sekunden zwischen zwei Regelschritten nach oben bzw. beim normalen
      Absenken, ab 0. Fallback für hoch_regelzeit_s und runter_regelzeit_s.
      Bei einem Netzdefizit wird unabhängig davon sofort abgeregelt.

      • maximum_step_change / minimum_step_change (Pflicht) – Maximale
      Sollwertänderung je Regelzyklus (größer als 0) und Schreib-Totband (ab 0,
      höchstens so groß wie das Maximum), beide in der Einheit aus output_unit.
      Fallback für max_anderung_pro_schritt_<w|a> und
      min_anderung_pro_schritt_<w|a>.

      Fehlt eines dieser sechs Felder, wird das Gerät beim Start nicht
      registriert und mit dem konkreten Feldfehler als inaktives Gerät
      angezeigt.

      BINÄRE GERÄTE (class: binary)

      • switch_entity (Pflicht) – Schalt-Entität des realen Geräts, z. B.
      switch.heizlufter. Sie wird nur gelesen; daraus stammen der Ist-Zustand
      und über last_changed die Lauf- und Auszeit.

      • power_w (Pflicht) – Angenommene Leistungsaufnahme im EIN-Zustand in
      Watt, größer als 0. Grundlage der Pool-Reservierung.

      • on_reserve_w (Pflicht, ab 0) – Gerätespezifischer Hysterese-Aufschlag
      beim Einschalten, zusätzlich zur globalen Einschaltreserve.

      • min_runtime_s / min_offtime_s / off_delay_s (Pflicht, jeweils ab 0) –
      Mindestlaufzeit, Mindestauszeit und Abschaltverzögerung in Sekunden.
      Mindestlaufzeit und Abschaltverzögerung gelten auch bei einer
      Notabschaltung – Geräteschutz schlägt Regelgüte.

      Alle fünf Felder sind Fallback für die gleichnamigen HA-Helfer
      leistung_w, einschaltreserve_w, mindestlaufzeit_s, mindestauszeit_s und
      abschaltverzogerung_s. Fehlt eines, wird das Gerät nicht registriert.

      • power_actual_entity (optional) – Sensor mit der tatsächlichen Ist-Leistung.
      Reine Datenquelle für spätere Ausbaustufen, ohne Wirkung auf die aktuelle
      Regelung.

      AC-SPEICHER (class: battery)

      • soc_entity (Pflicht) – Sensor-Entität mit dem Ladezustand in Prozent.
      Liefert sie „unavailable", fällt dieser Speicher aus der Regelung und
      geht auf Standby; die übrigen Geräte laufen weiter.

      • charge_power_entity + discharge_power_entity ODER power_entity
      (Pflicht) – Genau eine vollständige Ist-Leistungsvariante. Entweder zwei
      vorzeichenlose Sensoren für Lade- und Entladeleistung in Watt oder ein
      signierter Sensor. Beide Varianten gleichzeitig sind ungültig.

      • power_sign (nur mit power_entity, Standard „positiv_laden") –
      Vorzeichen von power_entity: „positiv_laden" oder „positiv_entladen".

      • available_charge_power_w / available_discharge_power_w (Pflicht,
      jeweils ab 0) – Direkt eingetragene verfügbare Lade- bzw.
      Entladeleistung in Watt. Sie sind die alleinigen physischen
      Maximalgrenzen. Ein Wert 0 sperrt die jeweilige Richtung bewusst.

      • capacity_kwh (optional, Standard 0) – Nutzbare Kapazität in kWh.
      Ausschließlich Anzeige (Energieinhalt), keine Regelgröße.

      • soc_max_hysteresis_percent (Standard 2) – Abstand unter soc_max, bevor
      Laden nach Erreichen des Maximums wieder freigegeben wird. Ohne diese
      Hysterese flippt der Speicher bei 100 % im Takt zwischen Laden und
      Standby.

      • direction_switch_delay_s (Standard 5) – Sperrzeit in Sekunden nach
      einem Richtungswechsel. Währenddessen wird Standby angefordert, nicht die
      alte Richtung fortgesetzt.

      Ein Speicher schreibt EINEN signierten Sollwert nach
      input_number.ems_<präfix>_anforderung_leistung_w (positiv = laden,
      negativ = entladen) und die Betriebsart nach
      input_select.ems_<präfix>_anforderung_betriebsart. Der Zahlen-Helfer
      braucht deshalb ein negatives Minimum, sonst klemmt Home Assistant jede
      Entladeanforderung auf 0. Der Auswahl-Helfer braucht die Optionen laden,
      entladen und standby. Die Übersetzung in Modbus- oder MQTT-Aufrufe
      übernimmt eine HA-Automation, nicht das Add-on.
  interval_s:
    name: Regelintervall (Sekunden)
    description: >-
      Wie oft der EMS-Regelzyklus ausgeführt wird. Kleinere Werte (z. B. 10 s)
      reagieren schneller auf Leistungsänderungen der PV-Anlage, erzeugen aber
      mehr HA-API-Anfragen. Empfehlung: 30 s für den normalen Betrieb.
      Erlaubter Bereich: 1 – 300 s.
  log_level:
    name: Log-Level
    description: >-
      Detaillierungsgrad der Add-on-Protokolle. „info" ist für den
      Normalbetrieb ausreichend. „debug" gibt zusätzlich alle
      Regelentscheidungen (Pool, Defizit, Geräte-Kandidaten) aus –
      nützlich zur Fehlersuche. Unabhängig davon lässt sich das
      zusätzliche Regelentscheidungs-Logging zur Laufzeit über den
      HA-Helfer „input_boolean.ems_pyems_debug_output" ein- und
      ausschalten, ohne das Add-on neu zu starten; der hier eingestellte
      Log-Level bleibt davon unberührt.
  post_cycle_script:
    name: Post-Cycle-Skript (optional)
    description: >-
      HA-Skript-Entity-ID (z. B. „script.hems_benachrichtigung"), das nach
      jedem abgeschlossenen EMS-Zyklus aufgerufen wird. Kann z. B. für
      Benachrichtigungen oder das Schreiben von Messwerten in einen externen
      Speicher genutzt werden. Leer lassen, wenn nicht benötigt.
  residual_power_entity:
    name: Überschuss-Sensor (verfügbare Leistung)
    description: >-
      HA-Sensor-Entität, die den aktuell für Überschussverbraucher verfügbaren
      PV-Überschuss in Watt liefert. Dies ist der wichtigste Eingangswert des
      EMS. Erwartete Semantik: positiver Wert = Einspeise-Überschuss, negativer
      Wert = Netzbezug; die bereits vom EMS geschalteten Lasten müssen im Wert
      noch enthalten (also abgezogen) sein, da das EMS sie zur Pool-Berechnung
      zurückrechnet. Standard:
      sensor.verfugbare_leistung_fur_uberschussverbraucher (Home Assistant
      slugifiziert Umlaute: ü→u, ö→o, ä→a, ß→ss).
  battery_residual_power_entity:
    name: Hausleistungsbilanz für AC-Speicher
    description: >-
      HA-Sensor-Entität für die Entladeplanung aller AC-Speicher. Negativ
      bedeutet Netzbezug beziehungsweise Unterdeckung, positiv Einspeisung.
      Der Wert muss Netzleistung und die Leistung der selbstregelnden
      E3DC-Batterie zusammenführen. Er wird ausschließlich für die Entladung
      benutzt; das Laden bleibt am Überschuss-Sensor. Bei einem konfigurierten
      AC-Speicher ist dieses Feld Pflicht. Liefert der Sensor unknown,
      unavailable oder keinen Zahlenwert, gehen alle AC-Speicher sicher in
      Standby.
  residual_formula_variables:
    name: Überschuss – Formel-Variablen (D-045)
    description: >-
      Optionale Liste benannter HA-Entitäten für eine Formel, die den
      Überschuss-Sensor oben ersetzen kann. Jeder Eintrag hat name (gültiger
      Bezeichner, z. B. „pv") und entity (vollständige Entity-ID). Bequemer zu
      pflegen im Bereich „Sensoren" des Ingress-Panels statt hier als YAML.
      Ohne zugehörigen Code (residual_formula_code) ohne Wirkung.
  residual_formula_code:
    name: Überschuss – Formel-Code (D-045)
    description: >-
      Eingeschränkter Python-Ausdruck, der die oben benannten Variablen
      verwenden und der Variable „ueberschuss" einen Wert zuweisen kann. Für
      jeden Namen „<n>" steht zusätzlich „<n>_valid" zur Verfügung. Liefert der
      Code einen gültigen, endlichen Wert, ersetzt er residual_power_entity
      vollständig; leer oder ungültig lässt das Verhalten unverändert. Erlaubt
      sind Zuweisungen, Arithmetik, Vergleiche, boolesche Verknüpfungen und
      if/else – keine Schleifen, Funktionsdefinitionen, Imports oder
      Attributzugriffe. Bequemer zu pflegen und mit einem Testlauf gegen den
      aktuellen HA-Stand zu prüfen im Bereich „Sensoren" des Ingress-Panels.
  battery_residual_formula_variables:
    name: Hausleistungsbilanz – Formel-Variablen (D-045)
    description: >-
      Wie residual_formula_variables, aber für die Hausleistungsbilanz. Ohne
      zugehörigen Code (battery_residual_formula_code) ohne Wirkung.
  battery_residual_formula_code:
    name: Hausleistungsbilanz – Formel-Code (D-045)
    description: >-
      Wie residual_formula_code, aber die Variable heißt „hausbilanz" und ein
      gültiges Ergebnis ersetzt battery_residual_power_entity statt
      residual_power_entity.
  speicher_in_residual_enthalten:
    name: Speicherleistung im Überschuss-Sensor enthalten
    description: >-
      Ob die Lade- und Entladeleistung der vom HEMS geregelten Speicher im
      Überschuss-Sensor bereits enthalten ist. Bei AC-gekoppelten Speichern mit
      Messpunkt an der Netzübergabe ist das der Normalfall („an"): das EMS
      rechnet die gemessene Entladung heraus, bevor es den Pool bildet.
      Andernfalls liest es die eigene Entladung als PV-Überschuss, schaltet
      Verbraucher zu und der Speicher ist in einem Zyklus leer. Auf „aus"
      stellen, wenn der Sensor den Speicher bereits herausrechnet. Prüfen:
      EMS deaktivieren, Speicher von Hand auf 1 kW Entladung zwingen – steigt
      der Sensorwert um 1 kW, gehört diese Option auf „an". Speicher, die das
      HEMS nicht regelt (z. B. ein selbstregelnder Hybridspeicher), sind davon
      nicht betroffen.
  available_modes:
    name: Aktivierte Regelmodi
    description: >-
      Kommagetrennte Liste der normalen Regelmodi, die in dieser Anlage
      überhaupt verwendet werden. Zulässig sind manuell, nur_heizen und
      nur_laden; Standard sind alle drei. Die Sondermodi „auto" (Energy Pilot)
      und „aus" gehören nicht in diese Liste und bleiben immer unterstützt.
      Die Auswahl je Gerät (allowed_modes) muss eine Teilmenge davon sein.
      Meldet input_select.ems_regelmodus einen normalen, hier nicht aktivierten
      Modus, ist der Zyklus sicher inaktiv – die Optionen des HA-Helfers legt
      oder ändert das Add-on nicht.
  flow_publish:
    name: Kartendaten veröffentlichen
    description: >-
      Schreibt nach jedem Regelzyklus zwei Anzeige-Sensoren nach Home
      Assistant: sensor.skytech_hems_flow_config trägt Layout, Anlagenwerte und
      Geräteliste, sensor.skytech_hems_flow_status die Kennzahlen des letzten
      Zyklus. Aus diesen beiden baut sich die Skytech Power Flow Card selbst
      auf; im Dashboard genügt dann type: custom:skytech-power-flow-card. Aus
      heißt: es wird keine einzige Entität geschrieben. Die beiden Sensoren
      tragen reine Anzeigedaten und schalten nichts. Empfehlung: beide vom
      recorder ausschließen, solange keine Historie gewünscht ist. Für das
      Einschalten wird mindestens ein Anlagenwert benötigt.
  flow_title:
    name: Überschrift der Karte
    description: >-
      Wird als Kartenüberschrift angezeigt. Leer lassen heißt: keine
      Überschrift. Im Dashboard lässt sich der Wert je Karte überschreiben.
  flow_watt_threshold:
    name: Umschaltschwelle W auf kW
    description: >-
      Ab diesem Betrag zeigt die Karte Kilowatt statt Watt, darunter Watt ohne
      Nachkommastelle. Zulässig sind 0 bis 100000.
  flow_animation:
    name: Wandernde Punkte
    description: >-
      Bewegte Punkte auf den Flusslinien. Unabhängig davon schaltet die Karte
      die Bewegung ab, wenn das Betriebssystem reduzierte Bewegung verlangt.
  flow_house_node:
    name: Hausknoten zeichnen
    description: >-
      Zeichnet das Haus als eigenen Knoten, an dem die HEMS-Geräte hängen. Aus
      heißt: die Geräte hängen direkt am Verteilpunkt zwischen Erzeugung, Netz
      und Speicher. Die Bilanzregeln bleiben in beiden Fällen dieselben.
  flow_pv_power_entities:
    name: PV-Leistungssensoren
    description: >-
      Sensoren der aktuellen Erzeugungsleistung in Watt. Eine leere Liste
      heißt: kein Erzeugungsknoten. Jeder Eintrag hat entity mit der
      vollständigen Entity-ID und optional in_summe. Nur Zeilen mit
      in_summe: true werden zur Erzeugungsleistung summiert; fehlt das Feld,
      gilt true. Zeilen mit in_summe: false erscheinen auf der Karte lediglich
      als Aufschlüsselung unter dem Knoten. So lassen sich die Systemleistung
      der Anlage und die einzelnen Strings nebeneinander eintragen, ohne beides
      zu zählen — das verdoppelte sonst die Erzeugung. Dieselbe Entität
      zweimal einzutragen ist ein Fehler, ebenso eine Entität, die bereits als
      Netzsensor eingetragen ist.
  flow_pv_label:
    name: Anzeigename der Erzeugung
    description: >-
      Beschriftung des Erzeugungsknotens auf der Karte.
  flow_grid_power_entity:
    name: Netzleistung (signiert)
    description: >-
      Ein Sensor, der Bezug und Einspeisung im Vorzeichen unterscheidet. Die
      Richtung legt flow_grid_power_sign fest. Alternativ getrennte Sensoren
      über flow_grid_import_entity und flow_grid_export_entity – beide Wege
      zugleich sind unzulässig.
  flow_grid_power_sign:
    name: Vorzeichen der Netzleistung
    description: >-
      positiv_bezug heißt: ein positiver Wert ist Bezug aus dem Netz, ein
      negativer ist Einspeisung. positiv_einspeisung bedeutet das Gegenteil.
      Gilt nur für den signierten Netzsensor.
  flow_grid_import_entity:
    name: Netzbezug (getrennter Sensor)
    description: >-
      Bezugsleistung in Watt als eigener, immer positiver Sensor. Nur zusammen
      mit flow_grid_export_entity und nur ohne flow_grid_power_entity.
  flow_grid_export_entity:
    name: Netzeinspeisung (getrennter Sensor)
    description: >-
      Einspeiseleistung in Watt als eigener, immer positiver Sensor. Nur
      zusammen mit flow_grid_import_entity und nur ohne flow_grid_power_entity.
  flow_grid_label:
    name: Anzeigename des Netzes
    description: >-
      Beschriftung des Netzknotens auf der Karte.
  flow_house_power_entity:
    name: Hausleistung
    description: >-
      Sensor des gesamten Hausverbrauchs in Watt. Leer lassen heißt: die Karte
      rechnet die Hausleistung aus Erzeugung, Netz und Speicher aus. Ein
      gemessener Wert ist genauer, weil er auch Verbraucher erfasst, die
      keinen Sensor haben.
  flow_house_label:
    name: Anzeigename des Hauses
    description: >-
      Beschriftung des Hausknotens auf der Karte.
  flow_battery_label:
    name: Anzeigename der Batterie
    description: >-
      Beschriftung des Batterieknotens. Leer lassen und keinen SoC-Sensor
      eintragen heißt: kein Batterieknoten. Gemeint ist der Hausspeicher der
      Anlage – auch dann, wenn das HEMS ihn gar nicht regelt (z. B. ein E3DC).
      Vom HEMS geregelte AC-Speicher stehen dagegen in der Geräteliste.
  flow_battery_soc_entity:
    name: Ladestand der Batterie
    description: >-
      Sensor des Ladestands in Prozent. Wird als Ring um den Batterieknoten
      gezeichnet.
  flow_battery_power_entity:
    name: Batterieleistung (signiert)
    description: >-
      Ein Sensor, der Laden und Entladen im Vorzeichen unterscheidet. Die
      Richtung legt flow_battery_power_sign fest. Alternativ getrennte
      Sensoren über flow_battery_charge_power_entity und
      flow_battery_discharge_power_entity – beide Wege zugleich sind
      unzulässig. Sobald die Batterie gezeichnet wird, ist genau einer der
      beiden Wege Pflicht.
  flow_battery_power_sign:
    name: Vorzeichen der Batterieleistung
    description: >-
      positiv_laden heißt: ein positiver Wert ist Laden, ein negativer ist
      Entladen. positiv_entladen bedeutet das Gegenteil. Gilt nur für den
      signierten Sensor.
  flow_battery_charge_power_entity:
    name: Ladeleistung (getrennter Sensor)
    description: >-
      Ladeleistung in Watt als eigener, immer positiver Sensor. Nur zusammen
      mit flow_battery_discharge_power_entity und nur ohne
      flow_battery_power_entity.
  flow_battery_discharge_power_entity:
    name: Entladeleistung (getrennter Sensor)
    description: >-
      Entladeleistung in Watt als eigener, immer positiver Sensor. Nur zusammen
      mit flow_battery_charge_power_entity und nur ohne
      flow_battery_power_entity.
