# Skytech HEMS — HA-Helfer für den ersten AC-Speicher (Anzeigename "Speicher 1")
# Technischer Präfix: acspeicher1 (Begründung siehe README.md in diesem Ordner —
# "speicher" ist für diese Anlage reserviert: ems_speicher_* gehört der bestehenden
# E3DC-Regelung).
# Domain: input_boolean

input_boolean:
  ems_acspeicher1_freigabe:
    name: "EMS Speicher 1 Freigabe"
    icon: mdi:home-battery
    initial: off

  ems_acspeicher1_technische_freigabe:
    name: "EMS Speicher 1 technische Freigabe"
    icon: mdi:home-battery
    initial: off

  # Bedienhelfer — optional mit Fallback "erlaubt", hier für echte Bedienbarkeit angelegt.
  # Eine fehlende Entität gilt als "erlaubt", eine vorhandene mit ungültigem State als "gesperrt".
  ems_acspeicher1_laden_erlaubt:
    name: "EMS Speicher 1 Laden erlaubt"
    icon: mdi:home-battery
    initial: on

  ems_acspeicher1_entladen_erlaubt:
    name: "EMS Speicher 1 Entladen erlaubt"
    icon: mdi:home-battery
    initial: on

  # Optional (D-060): Überschussverbraucher mit ems_<prefix>_aus_speicher_decken
  # bei einem PV-Einbruch überbrücken. Fehlt der Helfer, deckt der Speicher nur das Haus.
  ems_acspeicher1_uberschussverbraucher_versorgen:
    name: "EMS Speicher 1 Überschussverbraucher versorgen"
    icon: mdi:battery-arrow-down

  # Optionale Ladestufen (D-056) — bewusst auskommentiert, siehe input_number.yaml.
