name: CI (Lint, Tests & Frontend)

on:
  push:
    branches: [claude/main, main]
  pull_request:
    branches: [claude/main, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r app/requirements.txt

      - name: Ruff (Lint)
        run: ruff check app tests

      - name: Pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      # `npm run build` fuehrt zuerst `tsc --noEmit` aus – Typfehler brechen hier ab.
      - name: Build (Typprüfung + Bündel)
        run: npm run build
        working-directory: web

      # Das Bundle ist eingecheckt (D-035). Weicht der frische Build vom
      # eingecheckten Stand ab, wurde vergessen zu bauen – das faellt hier auf,
      # statt erst beim Nutzer.
      - name: Eingechecktes Bündel auf Drift prüfen
        run: |
          # --intent-to-add macht neu entstandene Dateien fuer `git diff` sichtbar;
          # ohne das bliebe ein umbenanntes Bundle (Vite haengt einen Hash an) unbemerkt.
          git add --intent-to-add -A app/static
          if ! git diff --exit-code --stat app/static; then
            echo "::error::app/static weicht vom frischen Build ab. 'cd web && npm run build' ausfuehren und das Ergebnis mitcommitten."
            exit 1
          fi
