name: Auto-deploy claude branch to main

# Triggers on every push to any claude/* branch (e.g. claude/ha-helper-readme-*)
on:
  push:
    branches:
      - 'claude/**'

jobs:
  backup-and-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all remote branches
        run: git fetch origin

      # Step 1: reset main_backup to the current state of main (clean snapshot)
      - name: Backup main → main_backup
        run: |
          git checkout -B main_backup origin/main
          git push origin main_backup --force
          echo "✓ main_backup updated to current main"

      # Step 2: merge the triggering claude/* branch into main
      - name: Merge claude branch → main
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          git checkout main
          git merge --no-ff "origin/${BRANCH}" \
            -m "auto-merge: ${BRANCH} → main [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push origin main
          echo "✓ ${BRANCH} merged into main"
